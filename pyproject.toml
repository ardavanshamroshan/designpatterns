[project]
name = "designpatterns"
version = "0.1.0"
description = "Hands-on Python tutorials for design patterns and SOLID principles"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[project.scripts]
srp = "solid.single_responsibility.main:main"
ocp = "solid.open_closed.main:main"
lsp = "solid.liskov.main:main"
isp = "solid.interface_segregation.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solid"]

[tool.uv]
package = true
